<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F5F5F7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="カード家計簿">
  <title>カード家計簿</title>
  <!-- アイコン（ホーム画面・ブラウザのタブ） -->
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 読み込み中 -->
  <div id="loading" class="loading">
    <div class="spinner" aria-label="読み込み中"></div>
  </div>

  <!-- ログイン画面 -->
  <section id="loginView" class="login" hidden>
    <div class="login-icon">
      <svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 9.5h19M6 15h4"/></svg>
    </div>
    <h1 class="login-title">カード家計簿</h1>
    <p class="login-text">カードの利用をメールから自動で記録して<br>次の支払い額をすぐに確認</p>
    <button id="loginBtn" class="btn btn-primary btn-large">Googleでログイン</button>
    <p id="loginError" class="msg error"></p>
  </section>

  <!-- メイン画面 -->
  <div id="appView" class="app" hidden>
    <!-- ヘッダー：スクロールすると小さな画面名のバーになる -->
    <header id="navbar" class="header">
      <span id="barTitle" class="bar-title" aria-hidden="true">ホーム</span>
    </header>
    <div class="large-title">
      <span id="todayLabel" class="large-title-date"></span>
      <h1 id="pageTitle" class="large-title-text">ホーム</h1>
    </div>

    <main class="main">

      <p id="dataError" class="banner-error" hidden></p>

      <!-- ===== ホーム ===== -->
      <section id="tab-home" class="page" data-title="ホーム">
        <div id="reviewArea"></div>
        <div id="payCard"></div>
        <div id="homeCalendar" class="card cal-card"></div>
        <div id="statGrid" class="stat-grid"></div>
      </section>

      <!-- ===== 明細（カレンダー＋リスト） ===== -->
      <section id="tab-list" class="page" data-title="明細" hidden>
        <div id="listCalendar" class="card cal-card"></div>

        <div class="month-sum-row">
          <div id="listSummary" class="month-sum"></div>
          <button id="listSearchBtn" class="icon-button" aria-label="検索と絞り込み" aria-expanded="false">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
          </button>
        </div>

        <div id="listSearchArea" class="search-area" hidden>
          <div class="search">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
            <input type="search" id="listSearch" placeholder="検索" aria-label="検索">
          </div>
          <div id="listFilter" class="chips-scroll" role="group" aria-label="絞り込み">
            <button type="button" class="chip is-active" data-filter="all">すべて</button>
            <button type="button" class="chip" data-filter="review">要確認</button>
            <button type="button" class="chip" data-filter="fixed">サブスク</button>
            <button type="button" class="chip" data-filter="manual">手入力</button>
            <button type="button" class="chip" data-filter="excluded">除外中</button>
          </div>
        </div>

        <div id="listBody"></div>
      </section>

      <!-- ===== レポート ===== -->
      <section id="tab-report" class="page" data-title="レポート" hidden>
        <div id="reportMode" class="segmented" role="group" aria-label="集計期間">
          <button type="button" data-mode="month" class="is-active">月</button>
          <button type="button" data-mode="year">年</button>
        </div>

        <div id="reportPager">
          <div class="toolbar">
            <button id="reportPrev" class="icon-button" aria-label="前へ">
              <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
            </button>
            <h2 id="reportPeriod" class="month-title"></h2>
            <button id="reportNext" class="icon-button" aria-label="次へ">
              <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
            </button>
          </div>
          <div id="reportSummary" class="card summary"></div>

          <h2 class="section-title">カテゴリ別</h2>
          <div class="card pie-card">
            <div id="reportPie"></div>
            <div id="reportLegend" class="legend"></div>
          </div>
        </div>

        <h2 id="reportBarTitle" class="section-title"></h2>
        <div class="card chart-card">
          <div id="reportBar"></div>
        </div>
      </section>

      <!-- ===== 設定 ===== -->
      <section id="tab-settings" class="page" data-title="設定" hidden>
        <h2 class="section-title"><span>サブスク</span><span id="subsTotal" class="section-aside"></span></h2>
        <div class="cells">
          <div id="subsList"></div>
          <button type="button" id="subsAdd" class="cell cell-add">
            <span class="add-icon">＋</span><span class="cell-text"><span class="cell-title">サブスクを追加</span></span>
          </button>
        </div>

        <h2 class="section-title">お店のアイコン</h2>
        <p id="storeIconError" class="banner-error" hidden></p>
        <div class="cells">
          <div id="storeIconList"></div>
          <button type="button" id="storeIconAdd" class="cell cell-add">
            <span class="add-icon">＋</span><span class="cell-text"><span class="cell-title">お店のアイコンを追加</span></span>
          </button>
        </div>

        <h2 class="section-title">カテゴリ</h2>
        <p id="catError" class="banner-error" hidden></p>
        <div class="cells">
          <div id="catList"></div>
          <button type="button" id="catAdd" class="cell cell-add">
            <span class="add-icon">＋</span><span class="cell-text"><span class="cell-title">カテゴリを追加</span></span>
          </button>
        </div>
        <div id="catUnregistered" class="chips" hidden></div>

        <h2 class="section-title">アカウント</h2>
        <div class="cells">
          <div class="cell cell-static">
            <span class="cell-text"><span class="cell-title">ログイン中</span></span>
            <span id="accountEmail" class="cell-value cell-quiet"></span>
          </div>
          <button type="button" id="logoutBtn" class="cell cell-danger">
            <span class="cell-text"><span class="cell-title">ログアウト</span></span>
          </button>
        </div>
      </section>
    </main>

    <!-- 手入力で追加 -->
    <button id="fab" class="fab" aria-label="手入力で追加">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>

    <!-- 下部タブ -->
    <nav class="tabbar">
      <span class="tab-indicator" aria-hidden="true"></span>
      <button class="tab active" data-tab="home">
        <svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>ホーム</span>
      </button>
      <button class="tab" data-tab="list">
        <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
        <span>明細</span>
      </button>
      <button class="tab" data-tab="report">
        <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>
        <span>レポート</span>
      </button>
      <button class="tab" data-tab="settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
        <span>設定</span>
      </button>
    </nav>
  </div>

  <!-- ===== 利用の入力・編集 ===== -->
  <dialog id="txSheet" tabindex="-1" class="sheet">
    <form id="txForm">
      <div class="sheet-bar">
        <button type="button" class="nav-link" data-close>キャンセル</button>
        <h2 id="txTitle" class="sheet-title">利用を追加</h2>
        <button type="submit" id="txSubmit" class="nav-link nav-link-bold">保存</button>
      </div>

      <p id="txSourceNote" class="sheet-note" hidden></p>

      <label class="amount-input">
        <input type="number" id="txAmount" step="1" inputmode="numeric" placeholder="0" required aria-label="金額">
        <span>円</span>
      </label>

      <div class="group">
        <div class="combo">
          <label class="field">
            <span class="field-label">カテゴリ</span>
            <input type="text" id="txCategory" maxlength="30" placeholder="未分類" autocomplete="off" role="combobox" aria-autocomplete="list">
            <svg class="combo-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
          </label>
          <div class="combo-list" role="listbox"></div>
        </div>
        <label class="field">
          <span class="field-label">お店</span>
          <input type="text" id="txStore" maxlength="100" placeholder="任意">
        </label>
        <label class="field">
          <span class="field-label">日付</span>
          <input type="date" id="txDate" required>
        </label>
        <label class="field">
          <span class="field-label">時刻</span>
          <input type="time" id="txTime">
        </label>
        <label class="field">
          <span class="field-label">メモ</span>
          <input type="text" id="txMemo" maxlength="100" placeholder="任意">
        </label>
      </div>

      <div id="txExcludedRow" class="group group-gap" hidden>
        <label class="field field-switch">
          <span class="field-label">計算から除外</span>
          <input type="checkbox" id="txExcluded" class="switch" role="switch">
        </label>
      </div>

      <div class="group group-gap">
        <button type="button" id="txStoreIcon" class="row-button" hidden>このお店のアイコンを設定</button>
        <button type="button" id="txDelete" class="row-button row-danger" hidden>この利用を削除</button>
      </div>
      <p id="txMsg" class="msg"></p>
    </form>
  </dialog>

  <!-- ===== サブスク（この月の分） ===== -->
  <dialog id="fixedItemSheet" tabindex="-1" class="sheet">
    <form id="fixedItemForm">
      <div class="sheet-bar">
        <button type="button" class="nav-link" data-close>閉じる</button>
        <h2 id="fixedItemTitle" class="sheet-title">サブスク</h2>
        <button type="submit" class="nav-link nav-link-bold">保存</button>
      </div>

      <p id="fixedItemNote" class="sheet-note"></p>

      <label class="amount-input">
        <input type="number" id="fixedItemAmount" min="0" step="1" inputmode="numeric" required aria-label="今月の金額">
        <span>円</span>
      </label>

      <div class="group">
        <label class="field field-switch">
          <span class="field-label">今月は計算から除外</span>
          <input type="checkbox" id="fixedItemExcluded" class="switch" role="switch">
        </label>
      </div>

      <div class="group group-gap">
        <button type="button" id="fixedItemReset" class="row-button" hidden>通常の金額に戻す</button>
        <button type="button" id="fixedItemEdit" class="row-button">サブスクの設定を開く</button>
      </div>
    </form>
  </dialog>

  <!-- ===== サブスクの追加・編集 ===== -->
  <dialog id="subSheet" tabindex="-1" class="sheet">
    <form id="subForm">
      <div class="sheet-bar">
        <button type="button" class="nav-link" data-close>キャンセル</button>
        <h2 id="subTitle" class="sheet-title">サブスクを追加</h2>
        <button type="submit" class="nav-link nav-link-bold">保存</button>
      </div>

      <div class="icon-picker">
        <!-- 画像を選ぶ：iPhone の Safari でも確実に開くよう、ファイルの入力欄そのものをタップさせる -->
        <label class="icon-picker-btn">
          <span id="subIconBtn" class="icon-picker-preview"></span>
          <input type="file" id="subIconFile" class="file-input" accept="image/*" aria-label="アイコン画像を選ぶ">
        </label>
        <div class="icon-picker-text">
          <span>アイコン</span>
          <button type="button" id="subIconRemove" class="link-button" hidden>画像を外す</button>
        </div>
      </div>

      <label class="amount-input">
        <input type="number" id="subAmount" min="0" step="1" inputmode="numeric" placeholder="0" required aria-label="金額">
        <span>円</span>
      </label>

      <div class="group">
        <label class="field">
          <span class="field-label">名前</span>
          <input type="text" id="subName" maxlength="50" placeholder="例：携帯料金" required>
        </label>
        <div class="combo">
          <label class="field">
            <span class="field-label">カテゴリ</span>
            <input type="text" id="subCategory" maxlength="30" placeholder="未分類" autocomplete="off" role="combobox" aria-autocomplete="list">
            <svg class="combo-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
          </label>
          <div class="combo-list" role="listbox"></div>
        </div>
        <label class="field">
          <span class="field-label">引き落とし日</span>
          <select id="subDay"></select>
        </label>
        <label class="field">
          <span class="field-label">開始月</span>
          <input type="month" id="subStart" required>
        </label>
        <label class="field">
          <span class="field-label">終了月</span>
          <input type="month" id="subEnd">
        </label>
      </div>

      <div class="group group-gap">
        <button type="button" id="subDelete" class="row-button row-danger" hidden>このサブスクを削除</button>
      </div>
      <p id="subMsg" class="msg"></p>
    </form>
  </dialog>

  <!-- ===== カテゴリの追加・編集 ===== -->
  <dialog id="categorySheet" tabindex="-1" class="sheet">
    <form id="categoryForm">
      <div class="sheet-bar">
        <button type="button" class="nav-link" data-close>キャンセル</button>
        <h2 id="categoryTitle" class="sheet-title">カテゴリを追加</h2>
        <button type="submit" class="nav-link nav-link-bold">保存</button>
      </div>

      <div class="group">
        <label class="field">
          <span class="field-label">名前</span>
          <input type="text" id="categoryName" maxlength="30" placeholder="例：食費" autocomplete="off" required>
        </label>
      </div>

      <h3 class="section-title section-title-s">色</h3>
      <div id="categorySwatches" class="swatches"></div>

      <p id="categoryNote" class="sheet-note" hidden></p>
      <div class="group group-gap">
        <button type="button" id="categoryDelete" class="row-button row-danger" hidden>このカテゴリを削除</button>
      </div>
      <p id="categoryMsg" class="msg"></p>
    </form>
  </dialog>

  <!-- ===== お店のアイコンの追加・編集 ===== -->
  <dialog id="storeIconSheet" tabindex="-1" class="sheet">
    <form id="storeIconForm">
      <div class="sheet-bar">
        <button type="button" class="nav-link" data-close>キャンセル</button>
        <h2 id="storeIconTitle" class="sheet-title">お店のアイコンを追加</h2>
        <button type="submit" class="nav-link nav-link-bold">保存</button>
      </div>

      <div class="store-icon-pick">
        <label class="icon-picker-btn icon-picker-l">
          <span id="storeIconBtn" class="icon-picker-preview"></span>
          <input type="file" id="storeIconFile" class="file-input" accept="image/*" aria-label="画像を選ぶ">
        </label>
      </div>

      <div class="group">
        <label class="field">
          <span class="field-label">お店の名前</span>
          <input type="text" id="storeIconKeyword" maxlength="50" placeholder="例：セブン" autocomplete="off" required>
        </label>
      </div>
      <p class="group-note">名前の一部で大丈夫です。全角と半角、記号の違いは気にしなくて大丈夫です。</p>
      <div id="storeIconMatches" class="matches"></div>

      <div class="group group-gap">
        <button type="button" id="storeIconDelete" class="row-button row-danger" hidden>このアイコンを削除</button>
      </div>
      <p id="storeIconMsg" class="msg"></p>
    </form>
  </dialog>

  <!-- ===== クイック入力（下から出るテンキー） ===== -->
  <dialog id="quickSheet" tabindex="-1" class="sheet sheet-quick" aria-labelledby="qDate">
    <div class="sheet-grabber" aria-hidden="true"></div>
    <div class="quick-head">
      <button type="button" class="nav-link" data-close>閉じる</button>
      <div class="quick-title">
        <h2 id="qDate"></h2>
        <span id="qDay"></span>
      </div>
      <button type="button" id="qDetail" class="nav-link">詳細</button>
    </div>

    <div class="quick-amount is-empty">
      <span id="qAmount" class="quick-num">0</span><span class="quick-yen">円</span>
    </div>

    <div id="qCats" class="quick-cats" role="group" aria-label="カテゴリ"></div>

    <input type="text" id="qStore" class="quick-store" maxlength="100" placeholder="お店・メモ（任意）" autocomplete="off">

    <div id="qKeypad" class="keypad">
      <button type="button" data-key="1">1</button>
      <button type="button" data-key="2">2</button>
      <button type="button" data-key="3">3</button>
      <button type="button" data-key="4">4</button>
      <button type="button" data-key="5">5</button>
      <button type="button" data-key="6">6</button>
      <button type="button" data-key="7">7</button>
      <button type="button" data-key="8">8</button>
      <button type="button" data-key="9">9</button>
      <button type="button" data-key="00">00</button>
      <button type="button" data-key="0">0</button>
      <button type="button" data-key="back" aria-label="1文字消す（長押しで全部）">
        <svg viewBox="0 0 24 24"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9l-6 6M11 9l6 6"/></svg>
      </button>
    </div>
    <button type="button" id="qSave" class="btn btn-primary btn-block quick-save" disabled>追加</button>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
