<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="カード家計簿">
  <title>カード家計簿</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 読み込み中 -->
  <div id="loading" class="loading">
    <div class="spinner" aria-label="読み込み中"></div>
  </div>

  <!-- ログイン画面 -->
  <section id="loginView" class="login" hidden>
    <div class="login-icon">
      <svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 9.5h19M6 15h4"/></svg>
    </div>
    <h1 class="login-title">カード家計簿</h1>
    <p class="login-text">カードの利用をメールから自動で記録して<br>次の支払い額をすぐに確認</p>
    <button id="loginBtn" class="btn btn-primary btn-large">Googleでログイン</button>
    <p id="loginError" class="msg error"></p>
  </section>

  <!-- メイン画面 -->
  <div id="appView" class="app" hidden>
    <header id="navbar" class="navbar">
      <span id="navTitle" class="navbar-title">ホーム</span>
    </header>

    <main class="main">
      <div class="title-row">
        <div class="title-text">
          <p id="todayText" class="title-eyebrow"></p>
          <h1 id="pageTitle" class="large-title">ホーム</h1>
        </div>
        <button id="accountBtn" class="avatar" aria-label="アカウントと設定">
          <img id="avatarImg" alt="" hidden referrerpolicy="no-referrer">
          <span id="avatarText"></span>
        </button>
      </div>

      <p id="dataError" class="banner-error" hidden></p>

      <!-- ===== ホーム ===== -->
      <section id="tab-home" class="page" data-title="ホーム">
        <div id="payCard" class="pay-card"></div>
        <div id="monthCard" class="stat-row"></div>

        <div id="reviewArea"></div>

        <button id="homeAddBtn" class="btn btn-tinted btn-block">手入力で追加</button>

        <h2 class="group-title">最近の利用</h2>
        <div id="recentList" class="list"></div>
      </section>

      <!-- ===== 明細 ===== -->
      <section id="tab-list" class="page" data-title="明細" hidden>
        <div class="month-nav">
          <button id="listPrev" class="cal-nav" aria-label="前の月">
            <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <h2 id="listMonth" class="month-title"></h2>
          <button id="listNext" class="cal-nav" aria-label="次の月">
            <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
        <div id="listSummary" class="month-summary"></div>
        <div id="listBody"></div>
        <button id="listAddBtn" class="btn btn-tinted btn-block list-add">この月に手入力で追加</button>
      </section>

      <!-- ===== レポート ===== -->
      <section id="tab-report" class="page" data-title="レポート" hidden>
        <h2 class="group-title">月ごとの利用額</h2>
        <div class="group chart-card">
          <div id="reportChart"></div>
        </div>
        <p class="group-note">棒をタップすると、その月の内訳を表示します。</p>

        <h2 id="reportCatTitle" class="group-title"></h2>
        <div id="reportCats" class="list"></div>
      </section>
    </main>

    <!-- 下部タブ -->
    <nav class="tabbar">
      <button class="tab active" data-tab="home">
        <svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>ホーム</span>
      </button>
      <button class="tab" data-tab="list">
        <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
        <span>明細</span>
      </button>
      <button class="tab" data-tab="report">
        <svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        <span>レポート</span>
      </button>
    </nav>
  </div>

  <!-- ===== アカウントのメニュー ===== -->
  <dialog id="accountSheet" class="action-sheet">
    <div class="action-group">
      <div class="action-header">
        <span class="action-header-title">ログイン中のアカウント</span>
        <span id="accountEmail" class="action-header-sub"></span>
      </div>
      <button type="button" id="openFixedBtn" class="action-button">固定費の設定</button>
      <button type="button" id="logoutBtn" class="action-button action-danger">ログアウト</button>
    </div>
    <div class="action-group">
      <button type="button" id="accountCancel" class="action-button action-bold">キャンセル</button>
    </div>
  </dialog>

  <!-- ===== 利用の入力・編集 ===== -->
  <dialog id="txSheet" class="sheet">
    <form id="txForm">
      <div class="sheet-bar">
        <button type="button" class="nav-link" data-close>キャンセル</button>
        <h2 id="txTitle" class="sheet-title">利用を追加</h2>
        <button type="submit" id="txSubmit" class="nav-link nav-link-bold">保存</button>
      </div>

      <p id="txSourceNote" class="sheet-note" hidden></p>

      <div class="group">
        <label class="field">
          <span class="field-label">日付</span>
          <input type="date" id="txDate" required>
        </label>
        <label class="field">
          <span class="field-label">時刻</span>
          <input type="time" id="txTime">
        </label>
        <label class="field">
          <span class="field-label">お店</span>
          <input type="text" id="txStore" maxlength="100" placeholder="例：コンビニ" required>
        </label>
        <label class="field">
          <span class="field-label">金額（円）</span>
          <input type="number" id="txAmount" step="1" inputmode="numeric" placeholder="0" required>
        </label>
        <label class="field">
          <span class="field-label">カテゴリ</span>
          <input type="text" id="txCategory" maxlength="30" list="categoryList" placeholder="未分類">
        </label>
        <label class="field">
          <span class="field-label">メモ</span>
          <input type="text" id="txMemo" maxlength="100" placeholder="任意">
        </label>
      </div>

      <div class="group group-gap">
        <button type="button" id="txDelete" class="row-button row-danger" hidden>この利用を削除</button>
      </div>
      <p id="txMsg" class="msg"></p>
    </form>
  </dialog>

  <!-- ===== 固定費（この月の分） ===== -->
  <dialog id="fixedItemSheet" class="sheet">
    <form id="fixedItemForm">
      <div class="sheet-bar">
        <button type="button" class="nav-link" data-close>閉じる</button>
        <h2 id="fixedItemTitle" class="sheet-title">固定費</h2>
        <button type="submit" id="fixedItemSubmit" class="nav-link nav-link-bold">保存</button>
      </div>

      <p id="fixedItemNote" class="sheet-note"></p>

      <div class="group">
        <label class="field">
          <span class="field-label">この月の金額（円）</span>
          <input type="number" id="fixedItemAmount" min="0" step="1" inputmode="numeric" required>
        </label>
      </div>
      <p class="group-note">金額を変えても、この月だけに反映されます。翌月以降はいつもの金額のままです。</p>

      <div class="group group-gap">
        <button type="button" id="fixedItemSkip" class="row-button row-danger">この月だけ削除</button>
        <button type="button" id="fixedItemRestore" class="row-button" hidden>この月の固定費を元に戻す</button>
        <button type="button" id="fixedItemReset" class="row-button" hidden>金額をいつもの金額に戻す</button>
      </div>
      <p class="group-note">メールでも同じ利用が届いた月は「この月だけ削除」で二重を防げます。</p>
    </form>
  </dialog>

  <!-- ===== 固定費の設定 ===== -->
  <dialog id="fixedSheet" class="sheet sheet-tall">
    <div class="sheet-bar">
      <span></span>
      <h2 class="sheet-title">固定費の設定</h2>
      <button type="button" class="nav-link nav-link-bold" data-close>完了</button>
    </div>

    <form id="fixedForm">
      <h3 id="fixedFormTitle" class="group-title">固定費を追加</h3>
      <div class="group">
        <label class="field">
          <span class="field-label">名前</span>
          <input type="text" id="fixedName" maxlength="50" placeholder="例：携帯料金" required>
        </label>
        <label class="field">
          <span class="field-label">金額（円）</span>
          <input type="number" id="fixedAmount" min="0" step="1" inputmode="numeric" placeholder="1000" required>
        </label>
        <label class="field">
          <span class="field-label">引き落とし日</span>
          <select id="fixedDay"></select>
        </label>
        <label class="field">
          <span class="field-label">カテゴリ</span>
          <input type="text" id="fixedCategory" maxlength="30" list="categoryList" placeholder="未分類">
        </label>
        <label class="field">
          <span class="field-label">開始月</span>
          <input type="month" id="fixedStart" required>
        </label>
        <label class="field">
          <span class="field-label">終了月</span>
          <input type="month" id="fixedEnd">
        </label>
      </div>
      <p class="group-note">解約したら終了月を入れてください。空欄ならずっと続きます。</p>

      <div class="form-actions">
        <button type="submit" id="fixedSubmit" class="btn btn-primary btn-block">追加する</button>
        <button type="button" id="fixedCancel" class="btn btn-plain btn-block" hidden>編集をやめる</button>
      </div>
      <p id="fixedMsg" class="msg"></p>
    </form>

    <h3 class="group-title">登録済みの固定費</h3>
    <div id="fixedList" class="list"></div>
  </dialog>

  <datalist id="categoryList"></datalist>

  <script type="module" src="app.js"></script>
</body>
</html>
