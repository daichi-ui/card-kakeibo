<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F5F5F7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="カード家計簿">
  <title>カード家計簿</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 読み込み中 -->
  <div id="loading" class="loading">
    <div class="spinner" aria-label="読み込み中"></div>
  </div>

  <!-- ログイン画面 -->
  <section id="loginView" class="login" hidden>
    <div class="login-icon">
      <svg viewBox="0 0 24 24"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M2.5 9.5h19M6 15h4"/></svg>
    </div>
    <h1 class="login-title">カード家計簿</h1>
    <p class="login-text">カードの利用をメールから自動で記録して<br>次の支払い額をすぐに確認</p>
    <button id="loginBtn" class="btn btn-primary btn-large">Googleでログイン</button>
    <p id="loginError" class="msg error"></p>
  </section>

  <!-- メイン画面 -->
  <div id="appView" class="app" hidden>
    <!-- ヘッダー：スクロールすると小さな画面名のバーになる -->
    <header id="navbar" class="header">
      <span id="barTitle" class="bar-title" aria-hidden="true">ホーム</span>
    </header>
    <div class="large-title">
      <div>
        <span id="todayLabel" class="large-title-date"></span>
        <h1 id="pageTitle" class="large-title-text">ホーム</h1>
      </div>
      <button id="accountBtn" class="avatar" aria-label="アカウント">
        <img id="avatarImg" alt="" hidden referrerpolicy="no-referrer">
        <span id="avatarText"></span>
      </button>
    </div>

    <main class="main">

      <p id="dataError" class="banner-error" hidden></p>

      <!-- ===== ホーム ===== -->
      <section id="tab-home" class="page" data-title="ホーム">
        <div id="payCard"></div>
        <div id="statGrid" class="stat-grid"></div>

        <div id="reviewArea"></div>
      </section>

      <!-- ===== カレンダー ===== -->
      <section id="tab-calendar" class="page" data-title="カレンダー" hidden>
        <div class="month-nav">
          <button id="calPrev" class="icon-button" aria-label="前の月">
            <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <h2 id="calMonth" class="month-title"></h2>
          <button id="calNext" class="icon-button" aria-label="次の月">
            <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
          </button>
          <button id="calToday" class="pill-button" hidden>今月に戻る</button>
        </div>
        <div class="card cal-card">
          <div id="calGrid" class="cal-grid"></div>
        </div>

        <div id="calSummary" class="card summary"></div>

        <h2 class="section-title">利用履歴</h2>
        <div id="calHistory" class="list"></div>
      </section>

      <!-- ===== サブスク ===== -->
      <section id="tab-subs" class="page" data-title="サブスク" hidden>
        <div class="month-nav">
          <button id="subsPrev" class="icon-button" aria-label="前の月">
            <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <h2 id="subsMonth" class="month-title"></h2>
          <button id="subsNext" class="icon-button" aria-label="次の月">
            <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
        <div id="subsSummary" class="card summary"></div>

        <h2 class="section-title">この月</h2>
        <div id="subsMonthList" class="list"></div>

        <h2 class="section-title">登録中</h2>
        <div id="subsAllList" class="list"></div>
        <button id="subsAddBtn" class="btn btn-tinted btn-block">サブスクを追加</button>
      </section>

      <!-- ===== 明細 ===== -->
      <section id="tab-list" class="page" data-title="明細" hidden>
        <div class="month-nav">
          <button id="listPrev" class="icon-button" aria-label="前の月">
            <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
          </button>
          <h2 id="listMonth" class="month-title"></h2>
          <button id="listNext" class="icon-button" aria-label="次の月">
            <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
          </button>
        </div>
        <div id="listSummary" class="card summary"></div>

        <div class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
          <input type="search" id="listSearch" placeholder="検索" aria-label="検索">
        </div>
        <div id="listFilter" class="chips-scroll" role="group" aria-label="絞り込み">
          <button type="button" class="chip is-active" data-filter="all">すべて</button>
          <button type="button" class="chip" data-filter="mail">Gmail</button>
          <button type="button" class="chip" data-filter="manual">手入力</button>
          <button type="button" class="chip" data-filter="fixed">サブスク</button>
          <button type="button" class="chip" data-filter="review">要確認</button>
          <button type="button" class="chip" data-filter="excluded">除外中</button>
        </div>

        <div id="listBody"></div>
        <button id="listAddBtn" class="btn btn-tinted btn-block list-add">この月に手入力で追加</button>
      </section>

      <!-- ===== レポート ===== -->
      <section id="tab-report" class="page" data-title="レポート" hidden>
        <div id="reportMode" class="segmented" role="group" aria-label="集計期間">
          <button type="button" data-mode="month" class="is-active">月</button>
          <button type="button" data-mode="year">年</button>
        </div>

        <div id="reportPager">
          <div class="month-nav">
            <button id="reportPrev" class="icon-button" aria-label="前へ">
              <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
            </button>
            <h2 id="reportPeriod" class="month-title"></h2>
            <button id="reportNext" class="icon-button" aria-label="次へ">
              <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
            </button>
          </div>
          <div id="reportSummary" class="card summary"></div>

          <h2 class="section-title">カテゴリ別の内訳</h2>
          <div class="card pie-card">
            <div id="reportPie"></div>
            <div id="reportLegend" class="legend"></div>
          </div>
        </div>

        <h2 id="reportBarTitle" class="section-title"></h2>
        <div class="card chart-card">
          <div id="reportBar"></div>
        </div>
      </section>
    </main>

    <!-- 下部タブ -->
    <nav class="tabbar">
      <button class="tab active" data-tab="home">
        <svg viewBox="0 0 24 24"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
        <span>ホーム</span>
      </button>
      <button class="tab" data-tab="calendar">
        <svg viewBox="0 0 24 24"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
        <span>カレンダー</span>
      </button>
      <button class="tab" data-tab="subs">
        <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.34-5.66"/><path d="M20 4v4h-4"/></svg>
        <span>サブスク</span>
      </button>
      <button class="tab" data-tab="list">
        <svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>
        <span>明細</span>
      </button>
      <button class="tab" data-tab="report">
        <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>
        <span>レポート</span>
      </button>
    </nav>
  </div>

  <!-- ===== アカウントのメニュー ===== -->
  <dialog id="accountSheet" class="action-sheet">
    <div class="action-group">
      <div class="action-header">
        <span class="action-header-title">ログイン中のアカウント</span>
        <span id="accountEmail" class="action-header-sub"></span>
      </div>
      <button type="button" id="openCategoryBtn" class="action-button">カテゴリ設定</button>
      <button type="button" id="logoutBtn" class="action-button action-danger">ログアウト</button>
    </div>
    <div class="action-group">
      <button type="button" id="accountCancel" class="action-button action-bold">キャンセル</button>
    </div>
  </dialog>

  <!-- ===== 利用の入力・編集 ===== -->
  <dialog id="txSheet" class="sheet">
    <form id="txForm">
      <div class="sheet-bar">
        <button type="button" class="nav-link" data-close>キャンセル</button>
        <h2 id="txTitle" class="sheet-title">利用を追加</h2>
        <button type="submit" id="txSubmit" class="nav-link nav-link-bold">保存</button>
      </div>

      <p id="txSourceNote" class="sheet-note" hidden></p>

      <div class="group">
        <label class="field">
          <span class="field-label">日付</span>
          <input type="date" id="txDate" required>
        </label>
        <label class="field">
          <span class="field-label">時刻</span>
          <input type="time" id="txTime">
        </label>
        <label class="field">
          <span class="field-label">お店</span>
          <input type="text" id="txStore" maxlength="100" placeholder="例：コンビニ">
        </label>
        <label class="field">
          <span class="field-label">金額（円）</span>
          <input type="number" id="txAmount" step="1" inputmode="numeric" placeholder="0" required>
        </label>
        <div class="combo">
          <label class="field">
            <span class="field-label">カテゴリ</span>
            <input type="text" id="txCategory" maxlength="30" placeholder="未分類" autocomplete="off" role="combobox" aria-autocomplete="list">
            <svg class="combo-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
          </label>
          <div class="combo-list" role="listbox"></div>
        </div>
        <label class="field">
          <span class="field-label">メモ</span>
          <input type="text" id="txMemo" maxlength="100" placeholder="任意">
        </label>
      </div>

      <div id="txExcludedRow" class="group group-gap" hidden>
        <label class="field field-switch">
          <span class="field-label">計算から除外</span>
          <input type="checkbox" id="txExcluded" class="switch" role="switch">
        </label>
      </div>

      <div class="group group-gap">
        <button type="button" id="txDelete" class="row-button row-danger" hidden>この利用を削除</button>
      </div>
      <p id="txMsg" class="msg"></p>
    </form>
  </dialog>

  <!-- ===== カレンダー：その日の支出 ===== -->
  <dialog id="daySheet" class="sheet">
    <form id="dayForm">
      <div class="sheet-bar">
        <button type="button" class="nav-link" data-close>閉じる</button>
        <h2 id="dayTitle" class="sheet-title"></h2>
        <button type="submit" class="nav-link nav-link-bold">追加</button>
      </div>

      <div class="group">
        <label class="field">
          <span class="field-label">金額（円）</span>
          <input type="number" id="dayAmount" step="1" inputmode="numeric" placeholder="0" required>
        </label>
        <label class="field">
          <span class="field-label">お店</span>
          <input type="text" id="dayStore" maxlength="100" placeholder="任意">
        </label>
        <div class="combo">
          <label class="field">
            <span class="field-label">カテゴリ</span>
            <input type="text" id="dayCategory" maxlength="30" placeholder="未分類" autocomplete="off" role="combobox" aria-autocomplete="list">
            <svg class="combo-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
          </label>
          <div class="combo-list" role="listbox"></div>
        </div>
      </div>
      <p id="dayMsg" class="msg"></p>

      <h3 class="section-title"><span>この日の利用</span><span id="dayTotal"></span></h3>
      <div id="dayList" class="list"></div>
    </form>
  </dialog>

  <!-- ===== サブスク（この月の分） ===== -->
  <dialog id="fixedItemSheet" class="sheet">
    <form id="fixedItemForm">
      <div class="sheet-bar">
        <button type="button" class="nav-link" data-close>閉じる</button>
        <h2 id="fixedItemTitle" class="sheet-title">サブスク</h2>
        <button type="submit" class="nav-link nav-link-bold">保存</button>
      </div>

      <p id="fixedItemNote" class="sheet-note"></p>

      <div class="group">
        <label class="field">
          <span class="field-label">今月の金額（円）</span>
          <input type="number" id="fixedItemAmount" min="0" step="1" inputmode="numeric" required>
        </label>
        <label class="field field-switch">
          <span class="field-label">計算から除外</span>
          <input type="checkbox" id="fixedItemExcluded" class="switch" role="switch">
        </label>
      </div>

      <div class="group group-gap">
        <button type="button" id="fixedItemReset" class="row-button" hidden>通常の金額に戻す</button>
        <button type="button" id="fixedItemEdit" class="row-button">サブスクを編集</button>
      </div>
    </form>
  </dialog>

  <!-- ===== サブスクの追加・編集 ===== -->
  <dialog id="subSheet" class="sheet">
    <form id="subForm">
      <div class="sheet-bar">
        <button type="button" class="nav-link" data-close>キャンセル</button>
        <h2 id="subTitle" class="sheet-title">サブスクを追加</h2>
        <button type="submit" class="nav-link nav-link-bold">保存</button>
      </div>

      <div class="group">
        <label class="field">
          <span class="field-label">名前</span>
          <input type="text" id="subName" maxlength="50" placeholder="例：携帯料金" required>
        </label>
        <label class="field">
          <span class="field-label">金額（円）</span>
          <input type="number" id="subAmount" min="0" step="1" inputmode="numeric" placeholder="1000" required>
        </label>
        <label class="field">
          <span class="field-label">引き落とし日</span>
          <select id="subDay"></select>
        </label>
        <div class="combo">
          <label class="field">
            <span class="field-label">カテゴリ</span>
            <input type="text" id="subCategory" maxlength="30" placeholder="未分類" autocomplete="off" role="combobox" aria-autocomplete="list">
            <svg class="combo-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
          </label>
          <div class="combo-list" role="listbox"></div>
        </div>
        <label class="field">
          <span class="field-label">開始月</span>
          <input type="month" id="subStart" required>
        </label>
        <label class="field">
          <span class="field-label">終了月</span>
          <input type="month" id="subEnd">
        </label>
      </div>

      <div class="group group-gap">
        <button type="button" id="subDelete" class="row-button row-danger" hidden>このサブスクを削除</button>
      </div>
      <p id="subMsg" class="msg"></p>
    </form>
  </dialog>


  <!-- ===== カテゴリ設定 ===== -->
  <dialog id="categorySheet" class="sheet">
    <div class="sheet-bar">
      <span></span>
      <h2 class="sheet-title">カテゴリ設定</h2>
      <button type="button" class="nav-link nav-link-bold" data-close>完了</button>
    </div>

    <form id="categoryForm" class="inline-form">
      <input type="text" id="categoryName" maxlength="30" placeholder="カテゴリ名" autocomplete="off" required>
      <button type="button" id="categoryCancel" class="nav-link" hidden>やめる</button>
      <button type="submit" id="categorySubmit" class="btn btn-primary btn-small">追加</button>
    </form>
    <p id="categoryMsg" class="msg"></p>

    <div id="categoryList" class="list"></div>

    <h3 id="categoryUnregisteredTitle" class="section-title" hidden>未登録</h3>
    <div id="categoryUnregistered" class="chips" hidden></div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
